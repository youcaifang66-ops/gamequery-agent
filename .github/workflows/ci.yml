name: reliability-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      RUN_SERVICE_INTEGRATION: "1"
      META_DB_PASSWORD: integration-meta-password
      DW_DB_PASSWORD: integration-dw-password
      DW_DB_HOST: 127.0.0.1
      QDRANT_URL: http://127.0.0.1:6333
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      qdrant:
        image: qdrant/qdrant:v1.16
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Initialize least-privilege MySQL fixtures
        run: |
          docker exec -i ${{ job.services.mysql.id }} mysql -uroot -pintegration-root-password < docker/mysql/meta.sql
          docker exec -i ${{ job.services.mysql.id }} mysql -uroot -pintegration-root-password < docker/mysql/dw.sql
          docker cp docker/mysql/99-grants.sh ${{ job.services.mysql.id }}:/tmp/99-grants.sh
          docker exec \
            -e MYSQL_ROOT_PASSWORD=integration-root-password \
            -e META_DB_PASSWORD="$META_DB_PASSWORD" \
            -e DW_DB_PASSWORD="$DW_DB_PASSWORD" \
            ${{ job.services.mysql.id }} bash /tmp/99-grants.sh
      - name: Lint all Python sources
        run: uv run ruff check app tests eval main.py
      - name: Run deterministic tests
        run: uv run pytest -q
      - name: Evaluate static SQL policy fixtures
        run: uv run python -c "from eval.run_sql_eval import evaluate; report=evaluate(); assert report['mode'] == 'static_fixture'"
      - name: Evaluate retrieval fixture and ablation
        run: uv run python -c "from eval.run_retrieval_eval import evaluate; report=evaluate('fixture'); assert report['mode'] == 'fixture'"
      - name: Generate deterministic scale smoke data
        run: uv run python eval/generate_scale_data.py --preset smoke --output "${{ runner.temp }}/gamequery-scale-smoke"
      - name: Verify tests did not mutate tracked artifacts
        run: git diff --exit-code

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check and build frontend
        run: pnpm build
