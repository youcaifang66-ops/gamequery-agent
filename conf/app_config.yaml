logging:
  file:
    enable: true
    level: INFO
    path: ${oc.env:LOG_PATH,logs}
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: ${oc.env:META_DB_HOST,localhost}
  port: ${oc.env:META_DB_PORT,3306}
  user: ${oc.env:META_DB_USER,gamequery_meta}
  password: ${oc.env:META_DB_PASSWORD}
  database: ${oc.env:META_DB_NAME,meta}

db_dw:
  host: ${oc.env:DW_DB_HOST,localhost}
  port: ${oc.env:DW_DB_PORT,3306}
  user: ${oc.env:DW_DB_USER,gamequery_reader}
  password: ${oc.env:DW_DB_PASSWORD}
  database: ${oc.env:DW_DB_NAME,dw}

qdrant:
  host: ${oc.env:QDRANT_HOST,localhost}
  port: 6333
  embedding_size: 1024

embedding:
  provider: ${oc.env:EMBEDDING_PROVIDER,huggingface_endpoint}
  host: ${oc.env:EMBEDDING_HOST,localhost}
  port: ${oc.env:EMBEDDING_PORT,8081}
  model: ${oc.env:EMBEDDING_MODEL,BAAI/bge-large-zh-v1.5}

es:
  host: ${oc.env:ES_HOST,localhost}
  port: 9200
  index_name: data_agent

llm:
  model_name: ${oc.env:LLM_MODEL_NAME,Pro/zai-org/GLM-5.1}
  api_key: ${oc.env:LLM_API_KEY}
  base_url: ${oc.env:LLM_BASE_URL,https://api.siliconflow.cn/v1}

sql_policy:
  max_rows: 500
  statement_timeout_ms: 5000

query:
  request_timeout_seconds: ${oc.env:QUERY_REQUEST_TIMEOUT_SECONDS,60}
  max_correction_attempts: ${oc.env:QUERY_MAX_CORRECTION_ATTEMPTS,2}

trace:
  database_path: ${oc.env:TRACE_DATABASE_PATH,data/traces.sqlite3}
  busy_timeout_ms: 5000
